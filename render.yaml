services:
  - type: web
    name: medquantum-nin
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://med-quantum-nin-jmf9.vercel.app,http://localhost:5173,http://localhost:3000,https://medquantum-nin.onrender.com
      - key: WFDB_SAMPLE_DIR
        value: ./data/samples
      - key: TEMP_DIR
        value: ./data/temp
      - key: MODEL_VERSION
        value: 1.0.0
    healthCheckPath: /api/health
    disk:
      name: ecg-data
      mountPath: /app/data
      sizeGB: 1
